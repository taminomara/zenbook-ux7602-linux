# ASUS Zenbook UX7602: the ALC285 drives two speaker pairs, but only one of
# them ("Speaker", DAC 0x02) has a hardware volume control; the other
# ("Bass Speaker", DAC 0x06) always plays at full level. Hardware volume
# therefore changes the balance between the pairs instead of the loudness.
# Use software volume so both pairs are scaled together.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
